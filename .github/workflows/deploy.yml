name: Deploy (realmedia.ink server)

# Builds on the runner, ships the artifacts to the aaPanel box (5.45.65.7)
# and restarts the systemd unit `realmedia.service` (bun SSR on :3000).
# The server never builds — it only runs `bun run dist/server/server.js`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-realmedia-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          VITE_SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run build

      - name: Strip dev dependencies (ship production node_modules)
        run: npm prune --omit=dev

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync build artifacts
        env:
          SSH: ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.DEPLOY_PORT }}
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete -e "$SSH" dist/         "$DEST/dist/"
          rsync -az --delete -e "$SSH" node_modules/ "$DEST/node_modules/"
          rsync -az          -e "$SSH" package.json  "$DEST/package.json"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl restart realmedia.service && sleep 2 && systemctl is-active realmedia.service"

      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://realmedia.ink/ || true)
          echo "realmedia.ink returned HTTP $code"
          test "$code" = "200"
